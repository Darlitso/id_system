<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIDS Console - Digital Citizen Identity</title>
<style>
:root{--bg:#0a0e13;--panel:#111821;--panel2:#0d131a;--line:#1e2a37;--tx:#d7e3ef;--mut:#7f92a6;--acc:#2dd4bf;--acc2:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--panel2);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;color:var(--acc);padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand small{display:block;color:var(--mut);font-weight:400;letter-spacing:.03em;font-size:11px;margin-top:3px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;color:var(--mut);padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
#nav button span{font-family:var(--mono);color:var(--acc);width:16px}
#nav button:hover{background:#15202b;color:var(--tx)}
#nav button.on{background:#0f2529;border-color:#1c4a4d;color:var(--tx)}
#nav em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:11px;background:var(--warn);color:#111;border-radius:10px;padding:0 7px}
.side-foot{margin-top:auto;font-size:11px;color:var(--mut);font-family:var(--mono);padding:8px;border-top:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:600}
.sp{flex:1}
.pill{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.pill.ok{color:var(--ok);border-color:#1b4d2c}.pill.warn{color:var(--warn);border-color:#5a4210}
.top select{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
main{padding:24px;max-width:1200px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 12px;font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpi label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.kpi b{display:block;font-size:30px;font-family:var(--mono);color:var(--acc);margin:2px 0}
.kpi small{color:var(--mut)}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dn{position:relative;width:140px;height:140px}
.dn svg{transform:rotate(-90deg)}
.dn span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:22px}
.legend{list-style:none;margin:0;padding:0;font-size:13px}
.legend li{display:flex;gap:8px;align-items:center;margin:4px 0}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-family:var(--mono);font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;background:linear-gradient(var(--acc2),var(--acc));border-radius:5px 5px 0 0;min-height:3px}
.feed{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12px}
.feed li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.feed time{color:var(--mut)}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#0f1720}
.mono{font-family:var(--mono);font-size:12.5px}
.tw{overflow-x:auto}
.b{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:20px;background:#1a2430;color:var(--mut);white-space:nowrap}
.b.active,.b.approved,.b.verified,.b.success{background:#0f2a1a;color:var(--ok)}
.b.pending,.b.submitted,.b.pending_review,.b.matching{background:#2b2210;color:var(--warn)}
.b.flagged,.b.suspended,.b.rejected,.b.denied,.b.failure,.b.revoked,.b.confirmed_duplicate{background:#2d1316;color:var(--bad)}
.btn{background:#16212c;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#04201c;border-color:var(--acc);font-weight:600}
.btn.ok{background:#0f2a1a;color:var(--ok);border-color:#1b4d2c}
.btn.bad{background:#2d1316;color:var(--bad);border-color:#5b2025}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{background:none;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{border-color:var(--acc);color:var(--acc)}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit}
input:focus,select:focus{outline:1px solid var(--acc);border-color:var(--acc)}
.term{background:#070a0e;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--mono);font-size:13px;min-height:200px;max-height:340px;overflow:auto}
.term div{margin:3px 0}.term .ok{color:var(--ok)}.term .bad{color:var(--bad)}.term .dim{color:var(--mut)}
.mc{display:grid;gap:10px}
.score{height:8px;background:#1a2430;border-radius:6px;overflow:hidden;margin:6px 0}
.score i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--bad))}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(480px,92vw)}
dialog::backdrop{background:#000a}
dialog label{display:block;font-size:12px;font-family:var(--mono);color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
dialog input,dialog select{width:100%}
#toast{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:20}
#toast div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px #0008}
#toast div.bad{border-left-color:var(--bad)}
.hint{color:var(--mut);font-size:12px;margin-top:10px}
label.pill{cursor:pointer}
.bio{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;background:var(--panel2)}
.bio small{display:block;color:var(--mut);font-family:var(--mono);font-size:11px}
dialog{max-height:92vh;overflow:auto}
label.pill input{padding:0;margin:0 6px 0 0;vertical-align:middle;width:auto}
.idc{border:1px solid #1c4a4d;border-radius:12px;padding:18px;background:linear-gradient(135deg,#0f2529,#111821)}
.idh{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--acc)}
.idn{font-family:var(--mono);font-size:30px;letter-spacing:.06em;margin:10px 0 14px;color:#fff}
.idg{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.idg label{margin:0 0 2px}
.idnote{font-size:11px;color:var(--mut);margin-top:14px;font-family:var(--mono)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto}#nav{flex-direction:row;flex-wrap:wrap}.side-foot{display:none}}
</style>
</head>
<body>
<div class="app">
 <aside>
  <div class="brand">NIDS CONSOLE<small>National Digital Identity System</small></div>
  <nav id="nav"></nav>
  <div class="side-foot">PROTOTYPE v0.1<br>in-memory demo data</div>
 </aside>
 <div>
  <div class="top">
   <h1 id="title"></h1><span class="sp"></span>
   <span class="pill ok">&#9679; SYSTEM ONLINE</span>
   <span class="pill warn">DEMO DATA</span>
   <span class="pill mono" id="clock"></span>
   <label class="pill" title="Demo: approve new enrolments instantly so an identity number is issued right away"><input type="checkbox" id="auto" checked>AUTO-APPROVE (DEMO)</label>
   <select id="roleSel" title="Switch the role you are viewing as"></select>
  </div>
  <main id="main"></main>
 </div>
</div>

<dialog id="dlg">
 <h3 style="margin:0 0 6px">New enrolment</h3>
 <label>Full name</label><input id="rn">
 <label>Date of birth</label><input id="rd" type="date">
 <label>District</label><input id="rdist">
 <label>Registration centre</label><select id="rc"></select>
 <label>Biometric capture</label>
 <div class="bio"><div><b>Fingerprint</b><small id="fpS">Not captured</small></div><button class="btn" id="fpB" onclick="capture('fp')">Capture</button></div>
 <div class="bio"><div><b>Iris</b><small id="irS">Not captured</small></div><button class="btn" id="irB" onclick="capture('iris')">Capture</button></div>
 <label>Demo control: who is at the scanner?</label><select id="rp" onchange="resetCap()"></select>
 <div class="row" style="margin:18px 0 0;justify-content:flex-end">
  <button class="btn" onclick="$('#dlg').close()">Cancel</button>
  <button class="btn pri" onclick="registerCitizen()">Submit enrolment</button>
 </div>
</dialog>
<dialog id="idd">
 <h3 style="margin:0 0 12px">Identity issued</h3>
 <div id="idbox"></div>
 <div class="row" style="margin:16px 0 0;justify-content:flex-end"><button class="btn pri" onclick="$('#idd').close()">Done</button></div>
</dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const ts=()=>new Date().toISOString().replace('T',' ').slice(0,19);

/* ---------- Roles (match staff_users.role in the database) ---------- */
const ALL=['overview','enrol','matches','citizens','verify','audit'];
const ROLES={
 registration_officer:{label:'Registration Officer',user:'officer.lusaka',views:['overview','enrol','citizens','verify'],can:['register']},
 reviewer:{label:'Reviewer',user:'reviewer.one',views:['overview','enrol','matches','citizens','verify'],can:['decide','match']},
 administrator:{label:'Administrator',user:'admin.one',views:ALL,can:['register','decide','match']},
 service_provider:{label:'Service Provider',user:'provider.bank',views:['verify'],can:[]},
 auditor:{label:'Auditor',user:'auditor.one',views:['overview','citizens','audit'],can:[]}
};
const NAV=[{id:'overview',t:'Overview',ic:'&#9672;'},{id:'enrol',t:'Enrolments',ic:'&#9636;'},{id:'matches',t:'Match review',ic:'&#9007;'},{id:'citizens',t:'Citizens',ic:'&#9673;'},{id:'verify',t:'Verify identity',ic:'&#8981;'},{id:'audit',t:'Audit log',ic:'&#8803;'}];
const TITLES={overview:'Operations overview',enrol:'Enrolments',matches:'Duplicate match review',citizens:'Citizen register',verify:'Verification console',audit:'Audit trail'};
let role='reviewer',view='overview';

/* ---------- Sample data (mirrors the seed file) ---------- */
let seq=100005,newReg=0,verifs=0;
/* Identity number format: 6 digits / 2 digits / 1 digit, e.g. 100006/10/1 */
const FMT=/^\d{6}\/\d{2}\/\d$/;
function newIdNumber(){let n;do{n=String(++seq).padStart(6,'0')+'/10/1'}while(citizens.some(c=>c.num===n));return n}
const centres=['LSK-001','KTW-001','LVG-001'];
const citizens=[
 {id:1,num:'100001/10/1',name:'Mwansa Chileshe',dob:'1990-03-14',district:'Lusaka',status:'active'},
 {id:2,num:'100002/10/1',name:'Natasha Banda',dob:'1995-07-22',district:'Kitwe',status:'active'},
 {id:3,num:'100003/10/1',name:'Joseph Phiri',dob:'1982-11-05',district:'Livingstone',status:'active'},
 {id:4,num:null,name:'Grace Mulenga',dob:'2000-01-30',district:'Lusaka',status:'pending'},
 {id:5,num:'100005/10/1',name:'Peter Zulu',dob:'1975-06-18',district:'Kitwe',status:'suspended'},
 {id:6,num:null,name:'Natasha Banda',dob:'1995-07-22',district:'Kitwe',status:'pending'},
 {id:7,num:null,name:'Brian Tembo',dob:'1998-09-09',district:'Livingstone',status:'pending'}
];
const enrolments=[
 {id:'ENR-001',cid:1,centre:'LSK-001',status:'approved',date:'2026-09-01'},
 {id:'ENR-002',cid:2,centre:'KTW-001',status:'approved',date:'2026-09-03'},
 {id:'ENR-003',cid:3,centre:'LVG-001',status:'approved',date:'2026-09-05'},
 {id:'ENR-004',cid:4,centre:'LSK-001',status:'submitted',date:'2026-10-20'},
 {id:'ENR-005',cid:6,centre:'LSK-001',status:'flagged',date:'2026-10-25'},
 {id:'ENR-006',cid:7,centre:'KTW-001',status:'rejected',date:'2026-10-22',reason:'Supporting documents incomplete'},
 {id:'ENR-007',cid:5,centre:'KTW-001',status:'approved',date:'2026-09-07'}
];
const matches=[
 {id:'M-001',enr:'ENR-005',cand:2,modality:'fingerprint',score:96.421,status:'pending_review'},
 {id:'M-002',enr:'ENR-005',cand:3,modality:'iris',score:38.01,status:'false_match',by:'reviewer.one',at:'2026-10-26 09:00:00'}
];
const audit=[
 {t:'2026-10-28 16:20:11',actor:'provider.bank',role:'service_provider',action:'credential.verify',entity:'credential',outcome:'failure'},
 {t:'2026-10-26 09:00:03',actor:'reviewer.one',role:'reviewer',action:'match.review',entity:'M-002',outcome:'success'},
 {t:'2026-10-25 15:00:42',actor:'officer.lusaka',role:'registration_officer',action:'enrolment.submit',entity:'ENR-005',outcome:'success'},
 {t:'2026-10-10 09:00:17',actor:'admin.one',role:'administrator',action:'credential.revoke',entity:'credential',outcome:'success'},
 {t:'2026-09-02 09:00:08',actor:'reviewer.one',role:'reviewer',action:'enrolment.approve',entity:'ENR-001',outcome:'success'}
];
/* ---------- Simulated biometrics (production uses certified scanners) ---------- */
const rnd=()=>Array.from({length:32},()=>Math.random());
const noisy=v=>v.map(x=>Math.min(1,Math.max(0,x+(Math.random()-.5)*.08)));
const quality=()=>Math.round((72+Math.random()*26)*10)/10;
const tmpl=v=>({v,q:quality()});
const score=(a,b)=>{let d=0;for(let i=0;i<a.length;i++)d+=Math.abs(a[i]-b[i]);d/=a.length;return Math.max(0,100*(1-d/0.3333))};
const THRESH=85;
citizens.forEach(c=>{c.bio={fp:tmpl(rnd()),iris:tmpl(rnd())}});
{const c2=citizens.find(c=>c.id===2),c6=citizens.find(c=>c.id===6);c6.bio={fp:tmpl(noisy(c2.bio.fp.v)),iris:tmpl(rnd())}}
function findMatches(bio,selfId){
 const out=[];
 for(const c of citizens){
  if(c.id===selfId||!c.bio)continue;
  for(const m of ['fp','iris']){
   const sc=score(bio[m].v,c.bio[m].v);
   if(sc>=THRESH)out.push({cand:c.id,modality:m==='fp'?'fingerprint':'iris',score:sc});
  }
 }
 return out;
}
const vlog=[{c:'dim',m:'NIDS verification service ready. Enter an identity number.'}];
let af={o:'all',q:''},ef='all',cq='',vwho='genuine';

/* ---------- Helpers ---------- */
const can=a=>ROLES[role].can.includes(a);
const nameOf=id=>(citizens.find(c=>c.id===id)||{}).name||'?';
const queue=()=>enrolments.filter(e=>e.status==='submitted'||e.status==='flagged').length;
const openMatches=()=>matches.filter(m=>m.status==='pending_review').length;
const badge=s=>`<span class="b ${esc(s)}">${esc(s)}</span>`;
function log(action,entity,outcome='success'){audit.unshift({t:ts(),actor:ROLES[role].user,role,action,entity,outcome})}
function toast(msg,bad){const d=document.createElement('div');if(bad)d.className='bad';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3500)}
function deny(action,entity){log(action,entity,'denied');toast('Your role is not permitted to do this','bad');render()}

/* ---------- Navigation ---------- */
function go(v){view=v;history.replaceState(null,'','#'+v);render()}
function setRole(r){role=r;if(!ROLES[r].views.includes(view))view=ROLES[r].views[0];render()}
$('#roleSel').innerHTML=Object.keys(ROLES).map(k=>`<option value="${k}">${esc(ROLES[k].label)}</option>`).join('');
$('#roleSel').value=role;
$('#roleSel').onchange=e=>setRole(e.target.value);
$('#rc').innerHTML=centres.map(c=>`<option>${c}</option>`).join('');
setInterval(()=>{$('#clock').textContent=ts()+' UTC'},1000);

/* ---------- Views ---------- */
function donut(){
 const cols={active:'#22c55e',pending:'#f59e0b',suspended:'#ef4444',deceased:'#64748b',revoked:'#a855f7'};
 const tot=citizens.length;let off=0,segs='',leg='';
 for(const k in cols){
  const n=citizens.filter(c=>c.status===k).length;if(!n)continue;
  const p=n/tot*100;
  segs+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${cols[k]}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}"/>`;
  off+=p;leg+=`<li><i style="background:${cols[k]}"></i>${k} <b class="mono">${n}</b></li>`;
 }
 return `<div class="donutwrap"><div class="dn"><svg viewBox="0 0 42 42" width="140" height="140">${segs}</svg><span>${tot}</span></div><ul class="legend">${leg}</ul></div>`;
}
function bars(){
 const d=[3,5,2,6,4,7,3];d[6]+=newReg;const m=Math.max(...d,1);
 const days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-(6-i));return x.toLocaleDateString('en',{weekday:'short'})});
 return `<div class="bars">${d.map((v,i)=>`<div>${v}<i style="height:${v/m*100}%"></i>${days[i]}</div>`).join('')}</div>`;
}
function feed(){
 return `<ul class="feed">${audit.slice(0,6).map(a=>`<li><time>${esc(a.t.slice(5,16))}</time><span>${esc(a.actor)}</span><span style="color:var(--acc2)">${esc(a.action)}</span>${badge(a.outcome)}</li>`).join('')}</ul>`;
}
const V={};
V.overview=()=>`
 <div class="grid kpis">
  <div class="card kpi"><label>Registered citizens</label><b>${citizens.length}</b><small>${citizens.filter(c=>c.status==='active').length} active</small></div>
  <div class="card kpi"><label>Review queue</label><b>${queue()}</b><small>enrolments awaiting decision</small></div>
  <div class="card kpi"><label>Open match cases</label><b>${openMatches()}</b><small>possible duplicates</small></div>
  <div class="card kpi"><label>Verifications</label><b>${verifs}</b><small>this session</small></div>
 </div>
 <div class="grid two">
  <div class="card"><h3>Citizens by status</h3>${donut()}</div>
  <div class="card"><h3>Enrolments, last 7 days</h3>${bars()}</div>
 </div>
 <div class="card"><h3>Live activity</h3>${feed()}</div>`;

V.enrol=()=>{
 const sts=['all','submitted','flagged','approved','rejected'];
 const rows=enrolments.filter(e=>ef==='all'||e.status===ef).slice().reverse().map(e=>{
  const act=(can('decide')&&(e.status==='submitted'||e.status==='flagged'))
   ?`<button class="btn ok" onclick="decide('${e.id}','approve')">Approve</button> <button class="btn bad" onclick="decide('${e.id}','reject')">Reject</button>`
   :`<span style="color:var(--mut)">${esc(e.reason||'')}</span>`;
  return `<tr><td class="mono">${e.id}</td><td>${esc(nameOf(e.cid))}</td><td class="mono">${esc(e.centre)}</td><td class="mono">${esc(e.date)}</td><td>${badge(e.status)}</td><td>${act}</td></tr>`;
 }).join('');
 return `<div class="row">${sts.map(s=>`<button class="chip ${s===ef?'on':''}" onclick="ef='${s}';render()">${s}</button>`).join('')}<span class="sp"></span>
  ${can('register')?'<button class="btn pri" onclick="openDlg()">+ New enrolment</button>':''}</div>
  <div class="card tw"><table><tr><th>ID</th><th>Citizen</th><th>Centre</th><th>Date</th><th>Status</th><th>Action</th></tr>${rows||'<tr><td colspan="6">No enrolments</td></tr>'}</table></div>
  <p class="hint">Flagged enrolments cannot be approved until their match cases are resolved.</p>`;
};

V.matches=()=>`<div class="mc">${matches.map(m=>`
 <div class="card"><div class="row" style="margin:0"><b class="mono">${m.id}</b>${badge(m.status)}<span class="sp"></span><span class="mono">${esc(m.enr)} &middot; ${esc(m.modality)}</span></div>
  <p style="margin:10px 0 0">Applicant <b>${esc(nameOf((enrolments.find(e=>e.id===m.enr)||{}).cid))}</b> may match existing citizen <b>${esc(nameOf(m.cand))}</b></p>
  <div class="score"><i style="width:${Math.min(m.score,100)}%"></i></div>
  <div class="mono">match score ${m.score.toFixed(3)} / 100</div>
  ${m.status==='pending_review'&&can('match')?`<div class="row" style="margin:12px 0 0"><button class="btn bad" onclick="resolveMatch('${m.id}','confirmed_duplicate')">Confirm duplicate</button><button class="btn ok" onclick="resolveMatch('${m.id}','false_match')">False match</button></div>`:''}
  ${m.by?`<div class="hint">Reviewed by ${esc(m.by)} at ${esc(m.at)}</div>`:''}</div>`).join('')||'<div class="card">No match cases</div>'}</div>`;

function citRows(){
 const q=cq.toLowerCase();
 return citizens.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.num||'').includes(q)||c.district.toLowerCase().includes(q))
  .map(c=>`<tr><td class="mono">${esc(c.num||'-')}</td><td>${esc(c.name)}</td><td class="mono">${esc(c.dob)}</td><td>${esc(c.district)}</td><td>${badge(c.status)}</td><td>${c.bio?`<span class="b active">FP ${c.bio.fp.q.toFixed(0)}</span> <span class="b active">IRIS ${c.bio.iris.q.toFixed(0)}</span>`:'-'}</td></tr>`).join('')
  ||'<tr><td colspan="6">No matching citizens</td></tr>';
}
V.citizens=()=>`<div class="row"><input id="cs" placeholder="Search name, number or district" value="${esc(cq)}" style="width:min(340px,100%)" oninput="cq=this.value;$('#cbody').innerHTML=citRows()"></div>
 <div class="card tw"><table><tr><th>Identity no.</th><th>Name</th><th>Date of birth</th><th>District</th><th>Status</th><th>Biometrics</th></tr><tbody id="cbody">${citRows()}</tbody></table></div>`;

V.verify=()=>`<div class="card"><h3>Identity verification terminal</h3>
 <div class="row"><input id="vnum" class="mono" placeholder="e.g. 100001/10/1" style="width:min(320px,100%)" onkeydown="if(event.key==='Enter')runVerify()"><select id="vwho" onchange="vwho=this.value" title="Demo control"><option value="genuine" ${vwho==='genuine'?'selected':''}>Presenting: the real holder</option><option value="impostor" ${vwho==='impostor'?'selected':''}>Presenting: a different person</option></select><button class="btn pri" onclick="runVerify()">Verify</button></div>
 <div class="term" id="term">${vlog.map(l=>`<div class="${l.c}">${esc(l.m)}</div>`).join('')}</div>
 <p class="hint">Checks the number, then compares the fingerprint presented at the counter with the one on record. Providers receive only the result and the name.</p></div>`;

function audRows(){
 const q=af.q.toLowerCase();
 return audit.filter(a=>(af.o==='all'||a.outcome===af.o)&&(!q||(a.actor+a.action+a.entity).toLowerCase().includes(q)))
  .map(a=>`<tr><td class="mono">${esc(a.t)}</td><td>${esc(a.actor)}</td><td class="mono">${esc(a.role)}</td><td class="mono" style="color:var(--acc2)">${esc(a.action)}</td><td class="mono">${esc(a.entity)}</td><td>${badge(a.outcome)}</td></tr>`).join('')
  ||'<tr><td colspan="6">No events</td></tr>';
}
V.audit=()=>`<div class="row"><input placeholder="Filter actor, action, entity" value="${esc(af.q)}" style="width:min(300px,100%)" oninput="af.q=this.value;$('#abody').innerHTML=audRows()">
 <select onchange="af.o=this.value;$('#abody').innerHTML=audRows()">${['all','success','denied','failure'].map(o=>`<option ${o===af.o?'selected':''}>${o}</option>`).join('')}</select></div>
 <div class="card tw"><table><tr><th>Time</th><th>Actor</th><th>Role</th><th>Action</th><th>Entity</th><th>Outcome</th></tr><tbody id="abody">${audRows()}</tbody></table></div>
 <p class="hint">Append-only: events can be added but never edited or deleted.</p>`;

/* ---------- Actions ---------- */
let cap={fp:null,iris:null};
function resetCap(){
 cap={fp:null,iris:null};
 for(const id of ['fp','ir']){$('#'+id+'S').textContent='Not captured';$('#'+id+'B').textContent='Capture';$('#'+id+'B').disabled=false}
}
function capture(m){
 const id=m==='fp'?'fp':'ir',st=$('#'+id+'S'),bt=$('#'+id+'B');
 bt.disabled=true;st.textContent='Scanning...';
 setTimeout(()=>{
  const who=$('#rp').value,src=who==='new'?null:citizens.find(c=>c.id===Number(who));
  cap[m]=tmpl(src?noisy(src.bio[m].v):rnd());
  st.textContent='Captured, quality '+cap[m].q.toFixed(1)+'/100';
  bt.textContent='Recapture';bt.disabled=false;
 },900);
}
function openDlg(){
 $('#rn').value='';$('#rd').value='';$('#rdist').value='';
 $('#rp').innerHTML='<option value="new">New person (random biometrics)</option>'+citizens.filter(c=>c.bio).map(c=>`<option value="${c.id}">Same person as ${esc(c.name)} (${esc(c.num||'pending')})</option>`).join('');
 resetCap();$('#dlg').showModal();
}
function registerCitizen(){
 const n=$('#rn').value.trim(),d=$('#rd').value,di=$('#rdist').value.trim(),ce=$('#rc').value;
 if(!can('register'))return deny('enrolment.submit','new');
 if(!n||!d)return toast('Name and date of birth are required','bad');
 if(d>today())return toast('Date of birth cannot be in the future','bad');
 if(!cap.fp||!cap.iris)return toast('Capture both fingerprint and iris first','bad');
 const c={id:citizens.length+1,num:null,name:n,dob:d,district:di||'-',status:'pending',bio:{fp:cap.fp,iris:cap.iris}};
 citizens.push(c);
 const e={id:'ENR-'+String(enrolments.length+1).padStart(3,'0'),cid:c.id,centre:ce,status:'submitted',date:today()};
 const hits=findMatches(c.bio,c.id);
 if(hits.length){e.status='flagged';hits.forEach(h=>matches.push({id:'M-'+String(matches.length+1).padStart(3,'0'),enr:e.id,cand:h.cand,modality:h.modality,score:h.score,status:'pending_review'}))}
 enrolments.push(e);newReg++;
 log('enrolment.submit',e.id);
 $('#dlg').close();
 if(hits.length){toast('Biometric match found: enrolment flagged as possible duplicate',true);render();return}
 if($('#auto').checked){issueId(e,c,true);return}
 toast('Enrolment submitted for review');render();
}
function decide(id,act){
 if(!can('decide'))return deny('enrolment.'+act,id);
 const e=enrolments.find(x=>x.id===id),c=citizens.find(x=>x.id===e.cid);
 if(act==='approve'&&matches.some(m=>m.enr===id&&m.status==='pending_review'))return toast('Resolve the open match case first','bad');
 if(act==='approve'){issueId(e,c,false);return}
 e.status='rejected';e.reason='Rejected by reviewer';
 log('enrolment.reject',id);toast('Enrolment rejected');render();
}
function issueId(e,c,auto){
 e.status='approved';e.decided=today();c.status='active';c.num=newIdNumber();
 log(auto?'enrolment.auto_approve':'enrolment.approve',e.id);
 showId(c);render();
}
function showId(c){
 $('#idbox').innerHTML=`<div class="idc"><div class="idh">DIGITAL IDENTITY RECORD</div>
  <div class="idn">${esc(c.num)}</div>
  <div class="idg"><div><label>Full name</label>${esc(c.name)}</div><div><label>Date of birth</label>${esc(c.dob)}</div>
  <div><label>District</label>${esc(c.district)}</div><div><label>Issued</label>${esc(today())}</div>
  <div><label>Status</label>${badge(c.status)}</div><div><label>Biometrics bound</label>Fingerprint + iris</div></div>
  <div class="idnote">Prototype record, not an official document. Biometrics were checked against every existing record before this number was issued.</div></div>`;
 $('#idd').showModal();
}
function resolveMatch(id,res){
 if(!can('match'))return deny('match.review',id);
 const m=matches.find(x=>x.id===id),e=enrolments.find(x=>x.id===m.enr);
 m.status=res;m.by=ROLES[role].user;m.at=ts();
 if(res==='confirmed_duplicate'){
  e.status='rejected';e.reason='Confirmed duplicate of '+nameOf(m.cand);
  matches.filter(x=>x.enr===m.enr&&x.status==='pending_review').forEach(x=>{x.status='closed';x.by=m.by;x.at=m.at});
 }else if(e.status==='flagged'&&!matches.some(x=>x.enr===m.enr&&x.status==='pending_review')){e.status='submitted'}
 log('match.review',id);toast('Match case updated');render();
}
function runVerify(){
 const n=$('#vnum').value.trim();if(!n)return;
 const c=citizens.find(x=>x.num===n);let r,l;
 if(!FMT.test(n)){r='not_verified';l={c:'bad',m:`[${ts().slice(11)}] ${n}  ->  INVALID FORMAT (expected 123456/10/1)`}}
 else if(!c){r='not_verified';l={c:'bad',m:`[${ts().slice(11)}] ${n}  ->  NOT VERIFIED (unknown number)`}}
 else if(c.status!=='active'){r='revoked';l={c:'bad',m:`[${ts().slice(11)}] ${n}  ->  NOT VALID (identity ${c.status})`}}
 else{
  const probe=vwho==='genuine'?noisy(c.bio.fp.v):rnd(),sc=score(probe,c.bio.fp.v);
  if(sc>=THRESH){r='verified';l={c:'ok',m:`[${ts().slice(11)}] ${n}  ->  VERIFIED  ${c.name}  (fingerprint match ${sc.toFixed(1)})`}}
  else{r='not_verified';l={c:'bad',m:`[${ts().slice(11)}] ${n}  ->  BIOMETRIC MISMATCH (score ${sc.toFixed(1)}), person is not the holder`}}
 }
 vlog.push({c:'dim',m:'> verify '+n});vlog.push(l);verifs++;
 log('credential.verify','credential',r==='verified'?'success':'failure');
 render();const t=$('#term');t.scrollTop=t.scrollHeight;$('#vnum').focus();
}

/* ---------- Render ---------- */
function render(){
 $('#nav').innerHTML=NAV.filter(n=>ROLES[role].views.includes(n.id)).map(n=>{
  const c=n.id==='matches'?openMatches():n.id==='enrol'?queue():0;
  return `<button class="${n.id===view?'on':''}" onclick="go('${n.id}')"><span>${n.ic}</span>${n.t}${c?`<em>${c}</em>`:''}</button>`;
 }).join('');
 $('#title').textContent=TITLES[view];
 $('#main').innerHTML=V[view]();
}
{const h=location.hash.slice(1);if(ROLES[role].views.includes(h))view=h}
render();
</script>
</body>
